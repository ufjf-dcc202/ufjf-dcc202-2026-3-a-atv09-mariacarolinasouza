<!DOCTYPE html>
<html lang="pt - BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC 202 Exemplo 01</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            border: 1px solid plum;
            background-color: pink;
        }

        li {
            border: 1px solid plum;
            color: white;
        }

        .desconstructed-pancake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .desconstructed-pancke>* {
            flex: 1 1 120px;
        }
    </style>
</head>

<body>
    <main>
        <article>
            <ul class="desconstructed-pancake">
                <li>Lorem, ipsum.</li>
                <li>Perferendis, rerum!</li>
                <li>Praesentium, accusantium?</li>
                <li>Voluptatibus, autem.</li>
            </ul>
        </article>
    </main>

</body>

</html>
